<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAGHU KUNDRA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Inter',sans-serif;
}

body{
    background:linear-gradient(
        180deg,
        #0f172a 0%,
        #111827 100%
    );
    color:#f8fafc;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:100%;
    max-width:420px;
    padding:24px;
    text-align:center;
}

.profile{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid rgba(255,255,255,0.12);
    margin-bottom:24px;
}

.name{
    font-size:2rem;
    font-weight:800;
    letter-spacing:0.04em;
    line-height:1.1;
    margin-bottom:12px;
}

.tagline{
    font-size:1rem;
    font-weight:600;
    color:#38bdf8;
    margin-bottom:20px;
}

.description{
    color:#cbd5e1;
    font-size:0.95rem;
    line-height:1.8;
    margin-bottom:24px;
}

.whatsapp-btn{
    display:inline-block;
    background:#25D366;
    color:#ffffff;
    text-decoration:none;
    font-size:1rem;
    font-weight:700;
    padding:14px 28px;
    border-radius:12px;
    margin-bottom:28px;
    transition:all 0.3s ease;
    box-shadow:0 8px 20px rgba(37,211,102,0.25);
}

.whatsapp-btn:hover{
    background:#1ebe5d;
    transform:translateY(-2px);
    box-shadow:0 12px 24px rgba(37,211,102,0.35);
}

.whatsapp-btn:active{
    transform:translateY(0);
}

.highlight{
    font-size:1.3rem;
    font-weight:800;
    color:#ffffff;
    line-height:1.4;
    letter-spacing:0.03em;
}

@media (max-height:700px){

    .profile{
        width:90px;
        height:90px;
        margin-bottom:18px;
    }

    .name{
        font-size:1.7rem;
    }

    .description{
        line-height:1.6;
        margin-bottom:20px;
    }

    .highlight{
        font-size:1.1rem;
    }

    .whatsapp-btn{
        padding:12px 24px;
        font-size:0.95rem;
    }
}
</style>
</head>

<body>

<div class="container">

    <img
        src="raghu.jpg"
        alt="Profile"
        class="profile"
    >

    <h1 class="name">
        RAGHU KUNDRA
    </h1>

    <div class="tagline">
        Software Work Expert
    </div>

    <p class="description">
        We Work Through Softwares and Our Special
        Methods To Do The Work. If You're Interested,
        Message Us On WhatsApp Now.
    </p>

    <a
        href="https://wa.link/8e5r1p"
        target="_blank"
        class="whatsapp-btn"
    >
        Message on WhatsApp
    </a>

    <div class="highlight">
        WE PROVIDE GENUINE WORK AND RESULTS.
        TRUSTED BY MORE THAN 10,000+ CLIENTS.
    </div>

</div>

</body>
</html>
